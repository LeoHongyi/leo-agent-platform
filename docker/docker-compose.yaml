services:
  mysql:
    image: mysql:8.4
    container_name: mysql-8.4
    restart: always
    env_file:
      - .env
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: redis-latest
    restart: always
    env_file:
      - .env
    command: /bin/sh -c 'exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes'
    volumes:
      - ./redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    restart: always
    env_file:
      - .env
    volumes:
      - ./minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    networks:
      - app-network


networks:
  app-network:
    driver: bridge
